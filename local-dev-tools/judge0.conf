################################################################################
# Judge0 Configuration File — LOCAL DEV ONLY
################################################################################
# This is Judge0's own config file (https://github.com/judge0/judge0), with
# just enough filled in to run locally against docker-compose.yml in this
# folder. Everything left blank uses Judge0's documented default.
#
# The passwords below are fine for "only reachable from my own laptop" use.
# If you ever expose port 2358 beyond localhost, change them and set
# AUTHN_TOKEN.


################################################################################
# Judge0 Server Configuration
################################################################################
JUDGE0_TELEMETRY_ENABLE=false
RESTART_MAX_TRIES=
MAINTENANCE_MODE=
MAINTENANCE_MESSAGE=
ENABLE_WAIT_RESULT=
ENABLE_COMPILER_OPTIONS=
ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=
ENABLE_COMMAND_LINE_ARGUMENTS=
ENABLE_SUBMISSION_DELETE=
ENABLE_BATCHED_SUBMISSIONS=
MAX_SUBMISSION_BATCH_SIZE=
ENABLE_CALLBACKS=
CALLBACKS_MAX_TRIES=
CALLBACKS_TIMEOUT=
ENABLE_ADDITIONAL_FILES=
SUBMISSION_CACHE_DURATION=
USE_DOCS_AS_HOMEPAGE=
DISABLE_IMPLICIT_BASE64_ENCODING=


################################################################################
# Judge0 Workers Configuration
################################################################################
INTERVAL=
COUNT=
MAX_QUEUE_SIZE=


################################################################################
# Judge0 Server Access Configuration
################################################################################
# Left blank on purpose: Judge0 falls back to Access-Control-Allow-Origin: *
# when ALLOW_ORIGIN/DISALLOW_ORIGIN are both blank, which is what lets the
# site's frontend call this from the browser directly. See
# config/application.rb in judge0/api if you want to lock this down later.
ALLOW_ORIGIN=
DISALLOW_ORIGIN=
ALLOW_IP=
DISALLOW_IP=


################################################################################
# Judge0 Authentication Configuration
################################################################################
# Left blank: authentication is disabled, since this is only reachable from
# your own machine. Set this (and the matching token in the site's Run
# Settings) if you ever expose this beyond localhost.
AUTHN_HEADER=
AUTHN_TOKEN=


################################################################################
# Judge0 Authorization Configuration
################################################################################
AUTHZ_HEADER=
AUTHZ_TOKEN=


################################################################################
# Redis Configuration
################################################################################
REDIS_HOST=redis
REDIS_PORT=
REDIS_PASSWORD=judge0_local_only_redis_password
RESQUE_NAMESPACE=


################################################################################
# PostgreSQL Configuration
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_local_only_postgres_password


################################################################################
# Submission Configuration
################################################################################
CPU_TIME_LIMIT=
MAX_CPU_TIME_LIMIT=
CPU_EXTRA_TIME=
MAX_CPU_EXTRA_TIME=
WALL_TIME_LIMIT=
MAX_WALL_TIME_LIMIT=
MEMORY_LIMIT=
MAX_MEMORY_LIMIT=
STACK_LIMIT=
MAX_STACK_LIMIT=
MAX_PROCESSES_AND_OR_THREADS=
MAX_MAX_PROCESSES_AND_OR_THREADS=
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=
MAX_FILE_SIZE=
MAX_MAX_FILE_SIZE=
NUMBER_OF_RUNS=
MAX_NUMBER_OF_RUNS=
REDIRECT_STDERR_TO_STDOUT=
MAX_EXTRACT_SIZE=
ALLOW_ENABLE_NETWORK=
ENABLE_NETWORK=


################################################################################
# Rails Configuration
################################################################################
RAILS_ENV=
RAILS_MAX_THREADS=
RAILS_SERVER_PROCESSES=
SECRET_KEY_BASE=
