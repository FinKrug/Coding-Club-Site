# Local dev stack: just the site's lsp-gateway (IntelliSense backend),
# listening on localhost so the site's Run Settings can point at it instead
# of our hosted gateway.
#
# This used to also run a self-hosted Judge0 (the code runner). That's been
# removed — Judge0's sandboxing needs the legacy cgroup v1 hierarchy, and
# WSL2 dropped support for it entirely as of WSL version 2.5.1, so it
# simply can't run under Docker on Windows anymore (Docker Desktop or a
# native Docker Engine install, it makes no difference — see README.md for
# the full story). "Run Code" on the site always uses our hosted Judge0
# now; that's unrelated to IntelliSense, which doesn't use cgroups at all.
#
# Usage (from this directory):
#   docker compose up -d --build
#
# The gateway comes up on ws://localhost:3001. See README.md in this folder
# for the full walkthrough.

services:
  lsp-gateway:
    build:
      context: ../lsp-gateway
    ports:
      - "3001:3001"
    restart: unless-stopped
