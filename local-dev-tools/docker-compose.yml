# Local dev stack:
# 1. mongodb: Local MongoDB instance (mongo:7) running on port 27017 with persistent volume
# 2. lsp-gateway: Language server gateway for local IntelliSense on port 3001
#
# Usage (from this directory):
#   docker compose up -d --build
#
# The site automatically defaults to this local MongoDB instance (mongodb://127.0.0.1:27017/coding-club)
# unless MONGODB_URI is explicitly configured in .env.local or the environment.

services:
  mongodb:
    image: mongo:7
    container_name: coding-club-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  lsp-gateway:
    build:
      context: ../lsp-gateway
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  mongodb_data:
